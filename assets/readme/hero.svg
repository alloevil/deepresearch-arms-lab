<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">deepresearch-arms-lab — 14-arm ablation study on deep research pipelines</title>
  <desc id="desc">A 14-cell grid, one cell per arm of the study, with the honest verdict distribution: four arms buy citation faithfulness at a judge-quality cost, six gain nothing or degrade, one is the baseline, and three are not separately tabled.</desc>

  <rect width="1200" height="420" rx="24" fill="#0D1117"/>

  <g id="header" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Arial, sans-serif">
    <text x="56" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" letter-spacing="1.6" fill="#8B949E">14-ARM ABLATION · ALL VERDICTS SHOWN · MiMo 2.5 PRO · BLIND-JUDGED</text>
    <text x="56" y="104" font-size="54" font-weight="700" fill="#E6EDF3">deepresearch-arms-lab</text>
    <text x="56" y="144" font-size="22" fill="#E6EDF3" opacity="0.82">Which citation mechanisms actually survive a weak Chinese base model?</text>
    <text x="56" y="176" font-size="18" fill="#8B949E">No arm wins on both axes — four buy faithfulness, six gain nothing, three stay exploratory.</text>
  </g>

